        .game-section { margin-bottom: var(--space-xl); }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: var(--space-md);

        .game-link {
            display: block;
            padding: var(--space-md);

            text-align: center;
            color: var(--color-text);
            text-decoration: none;
            border-bottom: 2px solid var(--color-border-sketch);
            font-family: var(--font-title);
            font-size: 1.1rem;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .game-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--color-border-sketch);
            color: var(--color-primary);
            border-bottom-color: var(--color-border-sketch);
        }
        .game-link .game-icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
    </style>
