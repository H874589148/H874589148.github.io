<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生长卷 · 模拟人生</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ================= 开局配置 ================= -->
  <div id="setup">
    <h1>人生长卷</h1>
    <div class="subtitle">浮 生 一 卷 · 落 笔 无 悔</div>

    <div class="sec">
      <div class="sec-title">出生朝代 / 时代</div>
      <div class="cards" id="eraCards"></div>
    </div>

    <div class="sec">
      <div class="sec-title">父母的职业</div>
      <div class="pick-hint" id="occHint">请先选择出生朝代，再定父母职业</div>
      <div class="cards c3" id="occCards"></div>
    </div>

    <div class="sec">
      <div class="sec-title">你的性别</div>
      <div class="cards" style="grid-template-columns:repeat(2,1fr)" id="genderCards"></div>
    </div>

    <div class="sec">
      <div class="sec-title">先天禀赋分配</div>
      <div id="attrRows"></div>
    </div>

    <div class="points-left">剩余可分配点数：<b id="pointsLeft">0</b>（总和固定 30，每项 1–10）</div>
    <button class="btn" id="btnBegin" disabled>此生启程</button>
    <button class="btn ghost" id="btnContinue">继续前生</button>
  </div>

  <!-- ================= 行进游戏 ================= -->
  <div id="game">
    <div id="hud">
      <div class="hud-top">
        <div id="ageBadge">年龄 <b>0</b> 岁</div>
        <div class="hud-btns">
          <button class="mini-btn" id="btnScroll">长卷</button>
          <button class="mini-btn" id="btnAudio">🔇</button>
        </div>
      </div>
      <div id="chips"></div>
    </div>

    <div id="scene">
      <div class="sky"></div>
      <div class="scene-poem">人生如逆旅<br>我亦是行人</div>
      <svg class="sun" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="52" fill="rgba(250,228,160,.25)"/>
        <circle cx="60" cy="60" r="38" fill="rgba(250,231,172,.42)"/>
        <circle cx="60" cy="60" r="25" fill="#f9edb9"/>
        <circle cx="51" cy="51" r="8" fill="#fdf7dd" opacity=".85"/>
      </svg>
      <svg class="clouds" viewBox="0 0 960 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <g id="sc-cl">

            <use href="#sc-cs" transform="translate(402,52) scale(.5)" opacity=".55"/>

        <use href="#sc-clouds" x="0"/>

      </svg>
      <svg class="birds" viewBox="0 0 960 140" preserveAspectRatio="none" aria-hidden="true">

      </svg>
      <svg class="ground" viewBox="0 0 960 80" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="sc-gg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dcc99c"/>
            <stop offset="1" stop-color="#c3aa7c"/>
          </linearGradient>
          <g id="sc-grd">
            <rect width="480" height="80" fill="url(#sc-gg)"/>
            <rect width="480" height="3" fill="#a8916a" opacity=".45"/>
            <g stroke="#93a878" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8">
              <path d="M40,40 Q37,32 34,29 M40,40 Q40,31 41,27 M40,40 Q44,33 47,30"/>
              <path d="M150,58 Q147,50 144,47 M150,58 Q150,49 151,45 M150,58 Q154,51 157,48"/>

        <path d="M225,24 L257,24 M205,50 L283,50 M185,68 L295,68" stroke="#d8c496" stroke-width="2" opacity=".8"/>
      </svg>
      <div class="shadow"></div>
      <div id="figure"><div class="fig-slot"></div></div>
    </div>

    <div id="panel">
      <div id="story">
        <div id="storyTag"></div>
        <div id="storyText"></div>
        <div id="delta"></div>
      </div>
      <div id="options"></div>
    </div>
  </div>

  <!-- ================= 结局 · 人生长卷 ================= -->
  <div id="ending">
    <div class="end-title" id="endTitle">一生落幕</div>
    <div class="end-age" id="endAge"></div>
    <div class="end-verdict" id="endVerdict"></div>
    <div class="end-log" id="endLog"></div>
    <button class="btn ghost" id="btnCopy" style="margin-top:14px">一键复制长卷</button>
    <button class="btn" id="btnRestart" style="margin-top:10px">再入轮回 · 重开一生</button>
  </div>
</div>

<!-- 随时查看 · 人生长卷浮层 -->
<div id="scrollOverlay">
  <div class="scroll-box">
    <div class="scroll-head"><span>人生长卷</span><button id="scrollClose">收起</button></div>
    <div id="scrollList"></div>
  </div>
</div>
