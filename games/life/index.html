<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>模拟人生 · 古风长卷</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"STKaiti","KaiTi","PingFang SC","Microsoft YaHei",serif;
    background:#efe6d5; color:#4a3b2c; user-select:none;
    display:flex; justify-content:center; touch-action:manipulation;
  }
  #app { width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; background:
    radial-gradient(ellipse at 50% 0%, rgba(255,251,240,.9), rgba(239,230,213,0) 60%), #efe6d5; }

  /* ============ 开局 ============ */
  #setup { padding:20px 18px 40px; }
  h1 { text-align:center; font-size:30px; letter-spacing:10px; color:#6b4f30; margin:14px 0 2px; }
  .subtitle { text-align:center; font-size:12px; color:#a08767; letter-spacing:4px; margin-bottom:18px; }
  .sec { background:rgba(255,252,245,.75); border:1px solid #d9c9ab; border-radius:14px;
    padding:14px; margin-bottom:14px; box-shadow:0 2px 8px rgba(107,79,48,.08); }
  .sec-title { font-size:15px; color:#6b4f30; letter-spacing:3px; margin-bottom:10px; font-weight:700; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .cards.c3 { grid-template-columns:repeat(3,1fr); }
  .pick {
    padding:10px 4px; text-align:center; font-size:14px; border-radius:10px; cursor:pointer;
    background:#f7f0e0; border:1px solid #d9c9ab; color:#6b5844; transition:.15s;
  }
  .pick.selected { background:#6b4f30; color:#f7ecd7; border-color:#6b4f30; box-shadow:0 3px 10px rgba(107,79,48,.3); }
  .pick:active { transform:scale(.96); }
  .attr-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px dashed #e3d7bf; }
  .attr-row:last-child { border-bottom:none; }
  .attr-name { font-size:15px; color:#5c4632; width:56px; }
  .attr-desc { font-size:10px; color:#a08767; flex:1; padding-left:4px; }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button {
    width:30px; height:30px; border-radius:50%; border:1px solid #c9b48c; background:#f7f0e0;
    color:#6b4f30; font-size:17px; cursor:pointer; line-height:1;
  }
  .stepper .val { font-size:17px; font-weight:700; min-width:22px; text-align:center; color:#6b4f30; }
  .points-left { text-align:center; font-size:13px; color:#a08767; margin:6px 0 14px; }
  .points-left b { color:#b3542e; font-size:17px; }
  .btn {
    display:block; width:100%; padding:14px 0; border:none; border-radius:12px; cursor:pointer;
    font-size:17px; font-weight:700; letter-spacing:5px; font-family:inherit;
    background:linear-gradient(160deg,#8a6a42,#6b4f30); color:#f7ecd7;
    box-shadow:0 4px 14px rgba(107,79,48,.35); transition:.15s;
  }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.4; pointer-events:none; }
  .btn.ghost { background:transparent; border:1px solid #c9b48c; color:#8a6a42; box-shadow:none;
    font-size:14px; padding:11px 0; letter-spacing:2px; }

  /* ============ 游戏界面 ============ */
  #game { display:none; flex-direction:column; min-height:100vh; }
  #hud { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; row-gap:4px; padding:10px 14px 6px; z-index:5; }
  #ageBadge { font-size:14px; color:#6b4f30; letter-spacing:1px; white-space:nowrap; }
  #ageBadge b { font-size:20px; }
  #chips { display:flex; gap:4px; flex-wrap:nowrap; justify-content:flex-end; }
  .chip {
    font-size:10px; background:rgba(255,252,245,.85); border:1px solid #d9c9ab; border-radius:8px;
    padding:3px 6px; color:#6b5844;
  }
  .chip b { color:#b3542e; }
  .chip.up { animation:chipup .8s ease; }
  @keyframes chipup { 30% { background:#ffe9c9; transform:scale(1.15); } }

  #scene { position:relative; height:44vh; min-height:300px; overflow:hidden;
    border-top:1px solid #d9c9ab; border-bottom:1px solid #d9c9ab; }
  .sky { position:absolute; inset:0; background:linear-gradient(180deg,#8fb4d6 0%,#bcd4e4 42%,#e6e4d2 78%,#d9ceae 100%); }
  .sun { position:absolute; top:7%; right:10%; width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 42% 40%, rgba(255,246,220,.95), rgba(244,214,140,.75) 55%, rgba(244,214,140,0) 78%);
    box-shadow:0 0 60px rgba(246,220,150,.6); }
  .scene-poem { position:absolute; top:5%; left:5%; writing-mode:vertical-rl;
    font-size:17px; letter-spacing:7px; color:rgba(90,70,50,.42); font-weight:700;
    text-shadow:0 0 6px rgba(255,255,255,.5); z-index:1; }
  .clouds { position:absolute; top:0; left:0; width:200%; height:56%;
    background:
      radial-gradient(ellipse 150px 46px at 74% 24%, rgba(255,255,255,.95), transparent 68%),
      radial-gradient(ellipse 100px 36px at 62% 16%, rgba(255,255,255,.85), transparent 68%),
      radial-gradient(ellipse 90px 30px at 88% 12%, rgba(255,255,255,.8), transparent 68%),
      radial-gradient(ellipse 120px 36px at 18% 34%, rgba(255,255,255,.5), transparent 70%),
      radial-gradient(ellipse 80px 26px at 36% 14%, rgba(255,255,255,.45), transparent 70%),
      radial-gradient(ellipse 60px 20px at 50% 40%, rgba(255,255,255,.4), transparent 70%);
    animation:drift 80s linear infinite; }
  @keyframes drift { to { transform:translateX(-50%); } }
  .mountains { position:absolute; bottom:24%; left:0; width:200%; height:36%;
    background:
      radial-gradient(ellipse 280px 110px at 8% 100%, rgba(146,168,182,.55) 60%, transparent 62%),
      radial-gradient(ellipse 340px 140px at 40% 100%, rgba(128,152,166,.48) 60%, transparent 62%),
      radial-gradient(ellipse 260px 100px at 70% 100%, rgba(146,168,182,.52) 60%, transparent 62%),
      radial-gradient(ellipse 300px 120px at 96% 100%, rgba(128,152,166,.46) 60%, transparent 62%);
    animation:scrollBg 90s linear infinite; }
  .trees { position:absolute; bottom:17%; left:0; width:200%; height:24%;
    background:
      radial-gradient(ellipse 30px 40px at 6% 62%, rgba(133,158,124,.85) 62%, transparent 64%),
      radial-gradient(ellipse 22px 30px at 8% 78%, rgba(112,140,106,.8) 62%, transparent 64%),
      radial-gradient(ellipse 34px 44px at 22% 58%, rgba(133,158,124,.8) 62%, transparent 64%),
      radial-gradient(ellipse 24px 32px at 41% 72%, rgba(112,140,106,.75) 62%, transparent 64%),
      radial-gradient(ellipse 32px 42px at 58% 60%, rgba(133,158,124,.8) 62%, transparent 64%),
      radial-gradient(ellipse 22px 30px at 76% 74%, rgba(112,140,106,.75) 62%, transparent 64%),
      radial-gradient(ellipse 34px 44px at 92% 58%, rgba(133,158,124,.8) 62%, transparent 64%);
    animation:scrollBg 45s linear infinite; }
  .ground { position:absolute; bottom:0; left:0; width:200%; height:20%;
    background:linear-gradient(180deg,#d8caa4 0%,#bfae86 100%);
    animation:scrollBg 22s linear infinite; }
  .ground::after { content:""; position:absolute; inset:0;
    background:
      radial-gradient(ellipse 34px 5px at 10% 30%, rgba(107,79,48,.14), transparent 70%),
      radial-gradient(ellipse 44px 6px at 30% 60%, rgba(107,79,48,.11), transparent 70%),
      radial-gradient(ellipse 28px 4px at 55% 35%, rgba(107,79,48,.13), transparent 70%),
      radial-gradient(ellipse 40px 5px at 78% 65%, rgba(107,79,48,.11), transparent 70%),
      radial-gradient(ellipse 34px 5px at 95% 40%, rgba(107,79,48,.12), transparent 70%); }
  @keyframes scrollBg { to { transform:translateX(-50%); } }

  #figure { position:absolute; bottom:3%; left:50%; transform:translateX(-50%);
    width:78vw; height:64%; max-height:520px; display:flex; align-items:flex-end; justify-content:center;
    background:radial-gradient(ellipse at 50% 80%, #fff5e8 0%, #ffe9d4 55%, #f3d9b8 100%);
    border-radius:18px; overflow:hidden;
    box-shadow:0 6px 18px rgba(107,79,48,.12), inset 0 -4px 12px rgba(107,79,48,.08); }
  #figure img { height:100%; width:auto; max-width:90%; object-fit:contain; object-position:bottom center; pointer-events:none; filter:drop-shadow(0 4px 6px rgba(74,59,44,.18)); }
  .shadow { position:absolute; bottom:7%; left:50%; transform:translateX(-50%);
    width:120px; height:14px; border-radius:50%; background:rgba(74,59,44,.18); }

  /* 叙事面板 */
  #panel { flex:1; padding:14px 16px 26px; display:flex; flex-direction:column; }
  #story {
    background:rgba(255,252,245,.88); border:1px solid #d9c9ab; border-radius:14px;
    padding:16px; box-shadow:0 3px 12px rgba(107,79,48,.1); animation:fadein .4s ease;
  }
  @keyframes fadein { from{opacity:0; transform:translateY(8px);} to{opacity:1;} }
  #storyTag { font-size:11px; color:#a08767; letter-spacing:2px; margin-bottom:6px; }
  #storyText { font-size:15.5px; line-height:1.9; color:#4a3b2c; }
  #options { margin-top:12px; display:flex; flex-direction:column; gap:9px; }
  .opt {
    padding:12px 14px; border-radius:11px; border:1px solid #c9b48c; cursor:pointer;
    background:#f9f3e4; font-size:14.5px; color:#5c4632; font-family:inherit; text-align:left;
    line-height:1.6; transition:.15s; animation:fadein .4s ease;
  }
  .opt small { display:block; font-size:11px; color:#a08767; margin-top:2px; }
  .opt:active { transform:scale(.98); background:#efe3c8; }
  .opt:disabled { opacity:.45; pointer-events:none; }
  #delta { margin-top:10px; font-size:12px; color:#8a6a42; min-height:16px; }
  #delta span { display:inline-block; margin-right:10px; animation:fadein .5s ease; }

  /* 结局 */
  #ending { display:none; padding:22px 18px 40px; }
  .end-title { text-align:center; font-size:24px; letter-spacing:6px; color:#6b4f30; margin:12px 0 4px; }
  .end-age { text-align:center; font-size:14px; color:#a08767; margin-bottom:16px; }
  .end-verdict { background:rgba(255,252,245,.85); border:1px solid #d9c9ab; border-radius:14px;
    padding:16px; font-size:15px; line-height:2; margin-bottom:14px; }
  .end-verdict b { color:#b3542e; }
  .end-log { background:rgba(255,252,245,.7); border:1px solid #e3d7bf; border-radius:14px;
    padding:14px 16px; font-size:13px; line-height:2; color:#6b5844; max-height:46vh; overflow-y:auto; }
  .end-log .li { border-bottom:1px dashed #e8dec9; padding:4px 0; }
  .end-log .li:last-child { border-bottom:none; }
  .end-log .y { color:#b3542e; font-weight:700; margin-right:6px; }
</style>
</head>
<body>
<div id="app">

  <!-- ================= 开局配置 ================= -->
  <div id="setup">
    <h1>模拟人生</h1>
    <div class="subtitle">一 卷 长 路 · 自 选 平 生</div>

    <div class="sec">
      <div class="sec-title">出生朝代 / 时代</div>
      <div class="cards" id="eraCards"></div>
    </div>

    <div class="sec">
      <div class="sec-title">父母的职业</div>
      <div class="cards c3" id="occCards"></div>
    </div>

    <div class="sec">
      <div class="sec-title">你的性别</div>
      <div class="cards" style="grid-template-columns:repeat(2,1fr)" id="genderCards"></div>
    </div>

    <div class="sec">
      <div class="sec-title">先天禀赋分配</div>
      <div id="attrRows"></div>
    </div>

    <div class="points-left">剩余可分配点数：<b id="pointsLeft">0</b>（总和固定 30，每项 1–10）</div>
    <button class="btn" id="btnBegin" disabled>确认，开始这一生</button>
  </div>

  <!-- ================= 游戏 ================= -->
  <div id="game">
    <div id="hud">
      <div id="ageBadge">年龄 <b>0</b> 岁</div>
      <div id="chips"></div>
    </div>
    <div id="scene">
      <div class="sky"></div>
      <div class="scene-poem">人生如逆旅<br>我亦是行人</div>
      <div class="sun"></div>
      <div class="clouds"></div>
      <div class="mountains"></div>
      <div class="trees"></div>
      <div class="ground"></div>
      <div class="shadow"></div>
      <div id="figure"></div>
    </div>
    <div id="panel">
      <div id="story">
        <div id="storyTag"></div>
        <div id="storyText"></div>
        <div id="delta"></div>
      </div>
      <div id="options"></div>
    </div>
  </div>

  <!-- ================= 结局 ================= -->
  <div id="ending">
    <div class="end-title" id="endTitle">一生落幕</div>
    <div class="end-age" id="endAge"></div>
    <div class="end-verdict" id="endVerdict"></div>
    <div class="end-log" id="endLog"></div>
    <button class="btn" style="margin-top:16px" onclick="location.reload()">再入轮回 · 重开一生</button>
  </div>
</div>

<script>
/* ================================================================
   数据：时代 / 职业 / 禀赋
================================================================ */
const ERA_GROUPS = {
  ancient: ["西汉","盛唐","北宋","大明","清朝"],
  minguo: ["民国"],
  modern: ["现代"]
};
const ERA_OF = {};
Object.keys(ERA_GROUPS).forEach(g => ERA_GROUPS[g].forEach(e => ERA_OF[e] = g));

const OCCUPATIONS = {
  ancient: ["农夫","木匠","小商贩","落第书生","武将","县衙小吏","郎中"],
  minguo: ["黄包车夫","纱厂工人","私塾先生","商铺掌柜","报馆编辑","西医大夫"],
  modern: ["农民","厂工","教师","医生","个体户","公务员","程序员","企业高管"]
};

const ATTRS = [
  ["iq","智商","学业与谋略"],
  ["eq","情商","人缘与处世"],
  ["talent","天赋","技艺与灵感"],
  ["body","体力","健康与命数"],
  ["wealth","财富","家底厚薄"],
  ["power","权力","门第势能"]
];
const TOTAL_POINTS = 30;

const state = {
  era:null, occ:null, gender:null,
  attrs:{ iq:5, eq:5, talent:5, body:5, wealth:5, power:5 },
  age:0, tags:new Set(), outfit:"cloth", stage:"child",
  log:[], alive:true, deathCause:null, used:new Set()
};

/* ================================================================
   开局界面逻辑
================================================================ */
function pickGroup(containerId, items, onPick){
  const c = document.getElementById(containerId);
  c.innerHTML = "";
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "pick"; d.textContent = it;
    d.onclick = () => {
      c.querySelectorAll(".pick").forEach(x => x.classList.remove("selected"));
      d.classList.add("selected"); onPick(it);
    };
    c.appendChild(d);
  });
}

pickGroup("eraCards", ["西汉","盛唐","北宋","大明","清朝","民国","现代"], era => {
  state.era = era;
  state.occ = null;
  pickGroup("occCards", OCCUPATIONS[ERA_OF[era]], occ => state.occ = occ);
  refreshBegin();
});
pickGroup("genderCards", ["男","女"], g => { state.gender = g; refreshBegin(); });

function renderAttrs(){
  const c = document.getElementById("attrRows");
  c.innerHTML = "";
  ATTRS.forEach(([key,name,desc]) => {
    const row = document.createElement("div");
    row.className = "attr-row";
    row.innerHTML = `<span class="attr-name">${name}</span><span class="attr-desc">${desc}</span>
      <div class="stepper">
        <button data-k="${key}" data-d="-1">−</button>
        <span class="val" id="val_${key}">${state.attrs[key]}</span>
        <button data-k="${key}" data-d="1">＋</button>
      </div>`;
    c.appendChild(row);
  });
  c.querySelectorAll("button").forEach(b => b.onclick = () => {
    const k = b.dataset.k, d = +b.dataset.d;
    const used = Object.values(state.attrs).reduce((s,v)=>s+v,0);
    const nv = state.attrs[k] + d;
    if (nv < 1 || nv > 10) return;
    if (d > 0 && used >= TOTAL_POINTS) return;
    state.attrs[k] = nv;
    document.getElementById("val_"+k).textContent = nv;
    document.getElementById("pointsLeft").textContent = TOTAL_POINTS - used - d + (d<0?0:0) + (d<0?0:0);
    updatePoints();
  });
  updatePoints();
}
function updatePoints(){
  const used = Object.values(state.attrs).reduce((s,v)=>s+v,0);
  document.getElementById("pointsLeft").textContent = TOTAL_POINTS - used;
  refreshBegin();
}
function refreshBegin(){
  const used = Object.values(state.attrs).reduce((s,v)=>s+v,0);
  document.getElementById("btnBegin").disabled =
    !(state.era && state.occ && state.gender && used === TOTAL_POINTS);
}
renderAttrs();
document.getElementById("pointsLeft").textContent = TOTAL_POINTS - 30;

/* ================================================================
   人物绘制（SVG 手绘古风）
================================================================ */
const SKIN = "#f5dcbd", INK = "#4a382c";
const OUTFITS = {
  cloth:    { robe:"#8f9678", robe2:"#79825f", pants:"#6e6250", sash:"#6b5a44", name:"布衣" },
  scholar:  { robe:"#7d94a8", robe2:"#67809a", pants:"#5a5c66", sash:"#4e5a68", name:"青衫" },
  wuxia:    { robe:"#63605a", robe2:"#514e48", pants:"#42403a", sash:"#8a3d3d", name:"劲装" },
  merchant: { robe:"#b08d60", robe2:"#96754c", pants:"#6b5844", sash:"#7a4a34", name:"绸衫" },
  official: { robe:"#9a4a4c", robe2:"#803c3e", pants:"#3d3a3a", sash:"#3a3448", name:"官服" },
  farmer:   { robe:"#ab9a74", robe2:"#90825e", pants:"#7a6a52", sash:"#6b5a44", name:"短褐" },
  medic:    { robe:"#e6e0ce", robe2:"#cfc8b2", pants:"#6b6b70", sash:"#7a8a6a", name:"杏林袍" },
  artist:   { robe:"#c68a98", robe2:"#a96e80", pants:"#7a6a72", sash:"#6e5a6a", name:"彩衣" },
  suit:     { robe:"#525e6e", robe2:"#424c5a", pants:"#3c4148", sash:"#33363c", name:"西装" },
  worker:   { robe:"#6e8ea2", robe2:"#5a7889", pants:"#4c5666", sash:"#3e4a56", name:"工装" },
  sport:    { robe:"#c46a52", robe2:"#a8563e", pants:"#4c4c56", sash:"#8a4432", name:"运动服" },
  casual:   { robe:"#8fa88e", robe2:"#769275", pants:"#6b6b70", sash:"#5e7060", name:"休闲装" }
};


/* 人物精灵图：按 (年代 / 阶段 / 性别) 选择
 * 由 aily-generate-image suite 在参考图风格下生成的 Q 版国风水彩图 */
const CHAR_MAP = {
  ancient: {
    child: { "男":"chars/ancient-child-boy.png", "女":"chars/ancient-child-girl.png" },
    teen:  { "男":"chars/ancient-teen-boy.png",  "女":"chars/ancient-teen-girl.png" },
    adult: { "男":"chars/ancient-adult-man.png",  "女":"chars/ancient-adult-woman.png" },
    elder: { "男":"chars/ancient-elder-man.png",  "女":"chars/ancient-elder-woman.png" }
  },
  modern: {
    /* 现代线：孩童沿用古风版（不变），少年/成年有现代装；老年沿用古风 */
    child: { "男":"chars/ancient-child-boy.png", "女":"chars/ancient-child-girl.png" },
    teen:  { "男":"chars/modern-teen-boy.png",   "女":"chars/modern-teen-girl.png" },
    adult: { "男":"chars/modern-adult-man.png",   "女":"chars/modern-adult-woman.png" },
    elder: { "男":"chars/ancient-elder-man.png",  "女":"chars/ancient-elder-woman.png" }
  }
};
const FALLBACK_CHAR = "chars/ancient-child-girl.png";

function renderFigure(){
  const eraGroup = ERA_OF[state.era] || "ancient";
  const stage = state.stage;
  const gender = state.gender;
  const url = (CHAR_MAP[eraGroup] && CHAR_MAP[eraGroup][stage] && CHAR_MAP[eraGroup][stage][gender]) || FALLBACK_CHAR;
  document.getElementById("figure").innerHTML =
    `<img src="${url}" alt="${stage} ${gender}" loading="eager" decoding="async">`;
}

/* ================================================================
   HUD
================================================================ */
const CHIP_NAME = { iq:"智", eq:"情", talent:"才", body:"体", wealth:"财", power:"势" };
function renderChips(changed){
  const c = document.getElementById("chips");
  c.innerHTML = ATTRS.map(([k]) =>
    `<span class="chip ${changed && changed[k] ? "up" : ""}">${CHIP_NAME[k]} <b>${state.attrs[k]}</b></span>`).join("");
}

/* ================================================================
   内容库
================================================================ */
/* 婴幼儿时期（0-5岁）叙述 */
const INFANT_TEXTS = [
  { era:"any", text:"你在{occ}之家呱呱坠地。父亲粗糙的手掌托起你时，眼里有藏不住的笑意。" },
  { era:"any", text:"周岁抓周，满床物件里你一把攥住了{item}。众人哄笑，说这娃娃日后{omen}。" },
  { era:"any", text:"三岁那年你发了一场高热，母亲背着你连夜求医。好在底子{bodyword}，挺了过来。" },
  { era:"any", text:"你学会了走路，摇摇晃晃地追着院里的鸡跑，摔了也不哭，爬起来接着追。" },
  { era:"any", text:"夏夜纳凉，父亲指着星空给你讲他年轻时候的营生。你听得似懂非懂，却记住了他眼里的光。" },

/* ================================================================
   引擎
================================================================ */
const A = state.attrs;
const clamp = v => Math.max(0, Math.min(12, v));
const eraGroup = () => ERA_OF[state.era];
const R = Math.random;

function applyEff(eff){
  const changed = {};
  if (!eff) return changed;
  Object.keys(eff).forEach(k => {
    A[k] = clamp(A[k] + eff[k]);
    changed[k] = eff[k];
  });
  renderChips(changed);
  return changed;
}
function deltaText(changed){
  const parts = [];
  Object.keys(changed || {}).forEach(k => {
    if (!changed[k]) return;
    const name = ATTRS.find(a => a[0] === k)[1];
    parts.push(`<span>${name} ${changed[k] > 0 ? "+" : ""}${changed[k]}</span>`);
  });
  return parts.join("");
}

function condOk(cond){
  if (!cond) return true;
  if (cond.minWealth && A.wealth < cond.minWealth) return false;
  if (cond.maxWealth && A.wealth > cond.maxWealth) return false;
  if (cond.minIq && A.iq < cond.minIq) return false;
  if (cond.minTalent && A.talent < cond.minTalent) return false;
  if (cond.minEq && A.eq < cond.minEq) return false;
  if (cond.tag && !state.tags.has(cond.tag)) return false;
  if (cond.anytag && !cond.anytag.some(t => state.tags.has(t))) return false;
  if (cond.notag && state.tags.has(cond.notag)) return false;
  if (cond.gender && state.gender !== cond.gender) return false;
  return true;
}
function eraOk(evEra){
  return evEra === "any" || evEra === eraGroup();
}
function fillText(t){
  return t.replace("{occ}", state.occ)
          .replace("{age}", state.age)
          .replace("{era}", state.era)
          .replace("{classic}", CLASSICS[Math.floor(R()*CLASSICS.length)])
          .replace("{item}", ZHUAZHOU[eraGroup()][0])
          .replace("{omen}", ZHUAZHOU[eraGroup()][1])
          .replace("{bodyword}", A.body >= 5 ? "硬朗" : "偏弱")
          .replace("{nameSchool}", A.iq >= 8 ? "顶尖学府" : "一所重点大学")
          .replace("{rankText}", A.iq + A.talent >= 14 ? "进士及第" : (A.iq >= 8 ? "举人老爷" : "秀才功名"))
          .replace("{loveResult}", A.eq + A.talent >= 10 ? "对方红着脸点了头。年少的喜欢，干净得像山泉。" : "对方愣了愣，笑着说「我们还是做朋友吧」。你难过了三天，然后长大了。")
          .replace("{gongResult}", A.iq + A.eq >= 12 ? "笔试面试一路过关，你上岸了。铁饭碗端稳。" : "差了两分落榜。你收拾心情，继续在社会上摸爬滚打。")
          .replace("{startupResult}", A.eq + A.talent + A.wealth >= 18 ? "三年后公司走上正轨，你们熬过了最难的时候。" : "十八个月后项目关停。赔了些钱，赚了一身本事。")
          .replace("{startupAfter}", R() < 0.5 ? "后来上市了，你婉拒的故事成了饭桌上的遗憾" : "没撑过第二年，你暗自庆幸")
          .replace("{investResult}", R() < 0.5 ? "赶上了风口，账面数字让你夜里笑醒" : "市场教你做人，学费交得肉疼");
}

function story(tag, text, delta){
  document.getElementById("storyTag").textContent = tag;
  document.getElementById("storyText").textContent = text;
  document.getElementById("delta").innerHTML = delta ? deltaText(delta) : "";
  const s = document.getElementById("story");
  s.style.animation = "none"; void s.offsetWidth; s.style.animation = "";
}
function showButtons(list){
  const box = document.getElementById("options");
  box.innerHTML = "";
  list.forEach(b => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = b.t + (b.sub ? `<small>${b.sub}</small>` : "");
    btn.onclick = b.fn;
    box.appendChild(btn);
  });
}
function continueBtn(text, fn){
  showButtons([{ t: text || "继续往前走 →", fn }]);
}

/* ---------- 年龄推进与死亡判定 ---------- */
function stageOf(age){
  return age < 15 ? "child" : age < 25 ? "teen" : age < 35 ? "adult" : age < 65 ? "mid" : "elder";
}
function refreshStage(){
  const st = stageOf(state.age);
  if (st !== state.stage) { state.stage = st; renderFigure(); }
}
function setOutfit(o){
  if (o && OUTFITS[o] && state.outfit !== o) { state.outfit = o; renderFigure(); }
}

function deathCheckPerYear(){
  if (state.age >= 95) { die("age"); return true; }
  let p = { ancient:0.011, minguo:0.009, modern:0.005 }[eraGroup()];
  p += Math.max(0, state.age - 55) * 0.0009;
  p += Math.max(0, state.age - 80) * 0.012;
  p -= A.body * 0.0006;
  if (state.flags_ill) p += 0.045;
  if (state.flags_ill === "half") p -= 0.02;
  if (R() < p) { die(state.flags_ill ? "illness" : (R() < 0.3 ? "accident" : "age")); return true; }
  return false;
}

/* ---------- 开局 ---------- */
document.getElementById("btnBegin").onclick = () => {
  // 家世微调
  const occBonus = {
    "小商贩":{wealth:1},"商铺掌柜":{wealth:1},"个体户":{wealth:1},"企业高管":{wealth:2,power:1},
    "县衙小吏":{power:1},"公务员":{power:1},"落第书生":{iq:1},"私塾先生":{iq:1},"教师":{iq:1},
    "郎中":{talent:1},"医生":{iq:1},"西医大夫":{iq:1},"武将":{body:1},"农夫":{body:1},"农民":{body:1},
    "木匠":{talent:1},"厂工":{body:1},"纱厂工人":{body:1},"黄包车夫":{body:1},"程序员":{iq:1},"军阀幕僚":{power:1},"报馆编辑":{eq:1}
  };
  const b = occBonus[state.occ];
  if (b) {
    Object.keys(b).forEach(k => A[k] = clamp(A[k] + b[k]));
    // 总和保持固定：从未被加成的属性里等量扣回（优先扣较高的）
    let excess = Object.values(A).reduce((x, y) => x + y, 0) - TOTAL_POINTS;
    const donors = Object.keys(A).filter(k => !b[k]).sort((x, y) => A[y] - A[x]);
    let guard = 0;
    while (excess > 0 && guard < 200) {
      const k = donors[guard % donors.length];
      if (A[k] > 1) { A[k]--; excess--; }
      guard++;
    }
  }

  document.getElementById("setup").style.display = "none";
  document.getElementById("game").style.display = "flex";
  renderChips(); renderFigure();
  state.log.push({ age:0, text:`出生于${state.era}，${state.occ}之家` });
  infantFlow(0);
};

function infantFlow(i){
  const pool = INFANT_TEXTS.filter(t => eraOk(t.era));
  if (i === 0) {
    story("出生 · " + state.era, fillText(pool[0].text));
    continueBtn("继续 →", () => infantFlow(1));
    return;
  }
  if (i <= 2) {
    const t = pool[1 + Math.floor(R() * (pool.length - 1))];
    story("幼年 · " + (i * 2 + 1) + " 岁", fillText(t.text));
    continueBtn("继续 →", () => infantFlow(i + 1));
    return;
  }
  state.age = 5;
  document.getElementById("ageBadge").innerHTML = `年龄 <b>5</b> 岁`;
  nextDecision();
}

/* ---------- 抉择主循环 ---------- */
function nextDecision(){
  if (!state.alive) return;
  refreshStage();
  document.getElementById("ageBadge").innerHTML =
    `年龄 <b>${state.age}</b> 岁 <span style="font-size:11px;color:#a08767">· ${state.era} · ${OUTFITS[state.outfit].name}</span>`;

  const pool = DECISIONS.filter(e =>
    !state.used.has(e.id) &&
    state.age >= e.min && state.age <= e.max &&
    eraOk(e.era) && condOk(e.cond)
  );

  if (!pool.length) {
    // 无可用抉择 → 平推岁月
    rollYears(state.age < 45 ? 2 + Math.floor(R()*2) : 3 + Math.floor(R()*3), () => {
      if (state.alive) nextDecision();
    });
    return;
  }
  const ev = pool[Math.floor(R() * pool.length)];
  state.used.add(ev.id);
  const opts = ev.options.filter(o => condOk(o.cond));
  story("人生抉择 · " + state.age + " 岁", fillText(ev.text));
  showButtons(opts.map(o => ({
    t: o.t, fn: () => chooseOption(ev, o)
  })));
}

function chooseOption(ev, o){
  const changed = applyEff(o.eff);
  (o.tags || []).forEach(t => state.tags.add(t));
  if (o.cure) state.flags_ill = null;
  if (o.halftreat) state.flags_ill = "half";
  if (o.notreat) state.flags_ill = "full";
  if (o.outfit) setOutfit(o.outfit);
  state.log.push({ age: state.age, text: o.t.replace(/（.*?）/g,"").slice(0, 24) });
  story("结果 · " + state.age + " 岁", fillText(o.say), changed);

  // 少年/青年阶段自动换装提示已含；15、25、35 节点阶段变化在 refreshStage 处理
  continueBtn("继续往前走 →", () => {
    const step = state.age < 45 ? 2 + Math.floor(R()*2) : 3 + Math.floor(R()*3);
    rollYears(step, () => { if (state.alive) nextDecision(); });
  });
}

/* ---------- 岁月推进（含随机事件） ---------- */
function rollYears(step, done){
  const cards = [];
  for (let y = 1; y <= step; y++) {
    state.age++;
    if (deathCheckPerYear()) return;
    // 随机事件
    const roll = R();
    if (roll < 0.10) {
      const pool = RANDOM_MAJOR.filter(e => eraOk(e.era) && condOk(e.cond) && !(e.requireAge && state.age < e.requireAge) && !state.used.has(e.id));
      if (pool.length) {
        const ev = pool[Math.floor(R() * pool.length)];
        state.used.add(ev.id);
        cards.push({ tag:"变故 · " + state.age + " 岁", text: ev.text, eff: ev.eff, major:true, ill: ev.ill });
      }
    } else if (roll < 0.45) {
      const pool = RANDOM_MINOR.filter(e => eraOk(e.era) && condOk(e.cond));
      if (pool.length) {
        const ev = pool[Math.floor(R() * pool.length)];
        cards.push({ tag:"岁月 · " + state.age + " 岁", text: ev.text, eff: ev.eff });
      }
    }
  }
  if (!cards.length) {
    cards.push({ tag:"岁月 · " + state.age + " 岁", text:"日子如流水，平静无波地淌过。你按部就班地长大、变老。", eff:null });
  }
  playCards(cards, 0, done);
}

function playCards(cards, i, done){
  if (i >= cards.length) { done(); return; }
  const c = cards[i];
  const changed = applyEff(c.eff);
  if (c.ill) state.flags_ill = "full";
  if (c.major) state.log.push({ age: state.age, text: c.text.replace(/【.*?】/g,"").slice(0, 26) });
  story(c.tag, fillText(c.text), changed);
  if (c.ill) {
    showButtons([
      { t:"不惜代价，全力救治", sub:"财富-3，祛除病根", fn: () => {
          if (A.wealth >= 3) {
            const ch = applyEff({wealth:-3});
            state.flags_ill = null;
            story("救治 · " + state.age + " 岁", "你散尽钱财求医问药，总算把命从鬼门关拉了回来。", ch);
          } else {
            story("救治 · " + state.age + " 岁", "家底单薄，你只能东拼西凑勉强医治。病去如抽丝，病根未除净。", null);
            state.flags_ill = "half";
          }
          continueBtn("继续 →", () => playCards(cards, i+1, done));
        } },
      { t:"能扛就扛，听天由命", sub:"体力-2，病根缠身（此后身故风险上升）", fn: () => {
          const ch = applyEff({body:-2});
          state.flags_ill = "full";
          story("硬扛 · " + state.age + " 岁", "你咬着牙挺过了最凶险的那几天，但从此落下了病根。", ch);
          continueBtn("继续 →", () => playCards(cards, i+1, done));
        } }
    ]);
    return;
  }
  continueBtn("继续 →", () => playCards(cards, i + 1, done));
}

/* ---------- 结局 ---------- */
function die(cause){
  state.alive = false;
  state.deathCause = cause;
  const causeText = { illness:"病逝", accident:"意外身故", war:"死于兵祸", age:"寿终正寝" }[cause] || "寿终正寝";

  // 称号评定
  const t = state.tags, s = [];
  const cand = [
    [t.has("official") && A.power >= 8, "一代名臣", "居庙堂之高，守心中之尺"],
    [t.has("knight") || (t.has("wuxia") && A.body >= 7), "江湖侠客", "仗剑走天涯，快意泯恩仇"],
    [t.has("tycoon") && A.wealth >= 8, "富甲一方", "算盘一响，黄金万两"],
    [t.has("doctor") && A.talent >= 6, "杏林圣手", "悬壶济世，活人无数"],
    [t.has("mentor") || t.has("teacher"), "桃李满门", "薪火相传，斯文不坠"],
    [t.has("art") && A.talent >= 7, "丹青妙手", "把热爱活成了一生的事业"],
    [t.has("philanthropist"), "一方善士", "散财济世，不留姓名"],
    [t.has("hermit") || t.has("fisher"), "田园隐士", "采菊东篱下，悠然见南山"],
    [t.has("runner") || (t.has("sport") && A.body >= 8), "健步一生", "把身体活成了最好的本钱"],
    [t.has("wanderer") || t.has("traveler"), "行者无疆", "见过天地，见过众生，见过自己"],
    [t.has("filial"), "至孝之人", "你养我小，我养你老"],
    [t.has("parent") && t.has("zen_parent"), "温暖的港湾", "孩子眼里，你是全世界最好的大人"]
  ];
  let title = "平凡而温热的一生", sub = "没干过惊天动地的大事，但把每一天都过得有滋有味";
  for (const [ok, ti, su] of cand) if (ok) { title = ti; sub = su; break; }

  document.getElementById("game").style.display = "none";
  const ed = document.getElementById("ending");
  ed.style.display = "block";
  document.getElementById("endTitle").textContent = title;
  document.getElementById("endAge").textContent =
    `享年 ${state.age} 岁 · ${causeText} · 生于${state.era}`;
  document.getElementById("endVerdict").innerHTML =
    `你是${state.era}一个<b>${state.occ}</b>之家的孩子，性别${state.gender}。<br>` +
    `这一生，智商 <b>${A.iq}</b> · 情商 <b>${A.eq}</b> · 天赋 <b>${A.talent}</b> · 体力 <b>${A.body}</b> · 财富 <b>${A.wealth}</b> · 权力 <b>${A.power}</b>。<br>` +
    `盖棺论定：<b>${sub}</b>。`;
  document.getElementById("endLog").innerHTML =
    `<div class="li" style="color:#a08767">—— 人生长卷 · 大事记 ——</div>` +
    state.log.map(l => `<div class="li"><span class="y">${l.age}岁</span>${l.text}</div>`).join("");
}

/* ================================================================
   调试句柄（测试用）
================================================================ */
window.__life = {
  raw: () => state,
  redraw: () => renderFigure(),
  state: () => ({
    era: state.era, occ: state.occ, gender: state.gender, age: state.age,
    attrs: { ...A }, tags: [...state.tags], outfit: state.outfit, stage: state.stage,
    alive: state.alive, log: state.log.length
  }),
  pickSetup(era, occ, gender){
    document.querySelectorAll("#eraCards .pick").forEach(d => { if (d.textContent === era) d.click(); });
    document.querySelectorAll("#occCards .pick").forEach(d => { if (d.textContent === occ) d.click(); });
    document.querySelectorAll("#genderCards .pick").forEach(d => { if (d.textContent === gender) d.click(); });
  },
  begin(){ document.getElementById("btnBegin").click(); },
  clickFirst(){
    const b = document.querySelector("#options .opt");
    if (b) { b.click(); return true; }
    return false;
  },
  storyText: () => document.getElementById("storyText").textContent,
  optionsCount: () => document.querySelectorAll("#options .opt").length,
  ending: () => ({
    shown: document.getElementById("ending").style.display === "block",
    title: document.getElementById("endTitle").textContent,
    age: document.getElementById("endAge").textContent,
    logItems: document.querySelectorAll("#endLog .li").length
  })
};
</script>
