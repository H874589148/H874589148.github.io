<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金矿工 - Gold Miner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2b1d0e;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    color: #fff;
    user-select: none;
  }
  h1 { color: #ffd94d; margin-bottom: 10px; font-size: 28px; text-shadow: 2px 2px 0 #000; }
  #hud {
    display: flex; gap: 24px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center;
  }
  #hud .item { font-size: 16px; }
  #hud .val { color: #ffd94d; font-weight: bold; }
  #stage { position: relative; }
  canvas {
    background: #8a5a28;
    border: 4px solid #5b3a12;
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
    max-width: 100%;
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.72);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { color: #ffd94d; font-size: 32px; margin-bottom: 14px; }
  #overlay p { font-size: 16px; line-height: 1.8; margin-bottom: 18px; }
  #overlay button {
    background: #ffd94d; color: #4a2c05; border: none; padding: 12px 36px;
    font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 0 #b8860b;
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8860b; }
  #tips { margin-top: 12px; color: #d8b98a; font-size: 13px; }
</style>
</head>
<body>
  <h1>黄金矿工</h1>
  <div id="hud">
    <span class="item">关卡: <span class="val" id="level">1</span></span>
    <span class="item">得分: <span class="val" id="score">0</span></span>
    <span class="item">目标: <span class="val" id="goal">650</span></span>
    <span class="item">时间: <span class="val" id="time">60</span>s</span>
    <span class="item">炸弹: <span class="val" id="bombs">1</span></span>
  </div>
  <div id="stage">
    <canvas id="game" width="800" height="560"></canvas>
    <div id="overlay">
      <h2>黄金矿工</h2>
      <p>
        钩子会来回摆动，按下 / 空格 / 点击 放下钩子。<br>
        抓金子赚分，分数达到目标即可过关；抓到石头收益低还拖时间。<br>
        拉到重物时按 <b>B 键</b> 可引爆（消耗炸弹），丢弃并快速收回。<br>
        时间耗尽未达标则游戏结束。
      </p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="tips">操作：↓ / 空格 / 鼠标点击 = 放钩；B = 引爆炸弹</div>

};
  const IMG = {};
  function loadAssets() {
    return Promise.all(Object.entries(ASSET_DEFS).map(([k, src]) => new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => { IMG[k] = im; res(); };
      im.onerror = () => rej(new Error('asset load failed: ' + k));
      im.src = src;
    })));
  }

  // ---------- 游戏状态 ----------
  let state = 'menu';  // menu | swinging | down | up | levelEnd | gameOver | win
  let level = 1, score = 0, goal = 0, timeLeft = 60, bombs = 1;
  let items = [];
  let angle = 0, angleDir = 1;
  const SWING_MIN = -Math.PI * (5 / 12), SWING_MAX = Math.PI * (5 / 12); // 以垂直向下为中枢 ±75°，贴近经典版摆幅
  let ropeLen = 45, ropeSpeed = 0, caught = null;
  const BASE_DOWN = 420;   // px/s
  const BASE_UP = 260;
  let lastTs = 0;

  function goalOf(lv) { return 650 + (lv - 1) * 850; }

  // ---------- 布矿 ----------
  function spawnItems(lv) {
    items = [];
    const tryPlace = (typeKey) => {
      const t = TYPES[typeKey];
      for (let i = 0; i < 60; i++) {
        const x = t.r + 10 + Math.random() * (W - 2 * (t.r + 10));
        const y = GROUND_Y + 40 + Math.random() * (H - GROUND_Y - 60 - t.r);
        let ok = true;
        for (const it of items) {
          const dx = it.x - x, dy = it.y - y;
          if (Math.hypot(dx, dy) < it.r + t.r + 14) { ok = false; break; }
        }
        if (ok) { items.push({ x, y, r: t.r, type: typeKey, value: t.value, weight: t.weight, color: t.color }); return; }
      }
    };
    const counts = {
      hugeGold:  Math.min(1 + Math.floor(lv / 3), 2),
      bigGold:   3 + Math.floor(lv / 2),
      smallGold: 5,
      rock:      4 + lv,
      diamond:   Math.min(1 + Math.floor(lv / 2), 3),
    };
    for (const [k, n] of Object.entries(counts)) for (let i = 0; i < n; i++) tryPlace(k);
  }

  function startLevel(lv) {
    level = lv;
    goal = goalOf(lv);
    timeLeft = 60;
    bombs = Math.min(bombs + 1, 3);
    spawnItems(lv);
    ropeLen = 45; angle = 0; angleDir = 1; caught = null;
    state = 'swinging';
    lastTs = performance.now();
    updateHud();
  }

  function updateHud() {
    elLevel.textContent = level;
    elScore.textContent = score;
    elGoal.textContent = goal;
    elTime.textContent = Math.max(0, Math.ceil(timeLeft));
    elBombs.textContent = bombs;
  }

  function showOverlay(title, html, btnText, onClick) {
    overlay.innerHTML = '';
    const h = document.createElement('h2'); h.textContent = title;
    const p = document.createElement('p'); p.innerHTML = html;
    const b = document.createElement('button'); b.textContent = btnText;
    b.addEventListener('click', onClick);
    overlay.append(h, p, b);
    overlay.classList.remove('hidden');
  }

  // ---------- 操作 ----------
  function fire() {
    if (state === 'swinging') { state = 'down'; ropeSpeed = BASE_DOWN; }
  }
  function detonate() {
    if (state === 'up' && caught && bombs > 0) {
      bombs--; caught = null; ropeSpeed = 900; updateHud();
    }
  }
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); fire(); }
    if (e.code === 'KeyB') detonate();
  });
  canvas.addEventListener('pointerdown', fire);

  startBtn.addEventListener('click', () => {
    score = 0; bombs = 0;
    overlay.classList.add('hidden');
    startLevel(1);
  });

  // ---------- 主循环 ----------
  function update(dt) {
    if (state === 'swinging') {
      angle += angleDir * dt * 1.6;
      if (angle > SWING_MAX) { angle = SWING_MAX; angleDir = -1; }
      if (angle < SWING_MIN) { angle = SWING_MIN; angleDir = 1; }
    } else if (state === 'down') {
      ropeLen += ropeSpeed * dt;
      const hx = HOOK_X + Math.sin(angle) * ropeLen;
      const hy = HOOK_Y + Math.cos(angle) * ropeLen;
      // 出界 -> 收回
      if (hx < 4 || hx > W - 4 || hy > H - 4) {
        state = 'up'; ropeSpeed = BASE_UP * 1.4;
      } else {
        for (const it of items) {
          if (Math.hypot(it.x - hx, it.y - hy) < it.r + 6) {
            caught = it;
            items.splice(items.indexOf(it), 1);
            state = 'up';
            ropeSpeed = BASE_UP / it.weight;
            break;
          }
        }
      }
    } else if (state === 'up') {
      ropeLen -= ropeSpeed * dt;
      if (ropeLen <= 45) {
        ropeLen = 45;
        if (caught) { score += caught.value; caught = null; updateHud(); }
        state = 'swinging';
      }
    }

    if (state === 'swinging' || state === 'down' || state === 'up') {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; endLevel(); }
      updateHud();
    }
  }

  function endLevel() {
    if (score >= goal) {
      state = 'levelEnd';
      showOverlay('过关！', `得分 <b>${score}</b> / 目标 ${goal}<br>奖励 1 颗炸弹`, '下一关',
        () => { overlay.classList.add('hidden'); startLevel(level + 1); });
    } else {
      state = 'gameOver';
      showOverlay('游戏结束', `最终得分 <b>${score}</b><br>坚持到了第 ${level} 关`, '重新开始',
        () => { overlay.classList.add('hidden'); score = 0; bombs = 0; startLevel(1); });
    }
  }

  // ---------- 绘制 ----------
  function drawItem(it) {
    const im = IMG[TYPES[it.type].img];
    if (im) ctx.drawImage(im, it.x - it.r, it.y - it.r, it.r * 2, it.r * 2);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 背景：天空横幅 + 矿层
    ctx.drawImage(IMG.bgSky, 0, 0, W, GROUND_Y);
    ctx.drawImage(IMG.bgUnderground, 0, GROUND_Y, W, H - GROUND_Y);

    // 矿工 + 绞盘（锚点=绞盘绳子出口，对准挂点）
    ctx.drawImage(IMG.miner, HOOK_X - 120, HOOK_Y - 78, 240, 120);

    // 矿物
    for (const it of items) drawItem(it);

    // 钩子与绳索
    const hx = HOOK_X + Math.sin(angle) * ropeLen;
    const hy = HOOK_Y + Math.cos(angle) * ropeLen;
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(HOOK_X, HOOK_Y); ctx.lineTo(hx, hy); ctx.stroke();
    // 钩爪
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(-angle);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-8, 8); ctx.quadraticCurveTo(-8, 16, 0, 16);
    ctx.quadraticCurveTo(8, 16, 8, 8);
    ctx.stroke();
    ctx.restore();

    // 抓着的东西跟着钩子走
    if (caught) {
      caught.x = hx; caught.y = hy + caught.r * 0.5 + 8;
      drawItem(caught);
    }
  }

  function loop(ts) {
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  startBtn.disabled = true;
  startBtn.textContent = '素材加载中…';
  loadAssets().then(() => {
    startBtn.disabled = false;
    startBtn.textContent = '开始游戏';
    lastTs = performance.now();
    requestAnimationFrame(loop);
  }).catch((e) => { startBtn.textContent = '素材加载失败'; console.error(e); });
})();
</script>
