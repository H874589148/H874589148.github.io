<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script>(function () { var t = localStorage.getItem('ee-theme'); if (t) document.documentElement.setAttribute('data-theme', t); })();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文分享 - EE工具箱</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/cursor.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-nav">
        <a class="back-btn" href="../index.html">&larr; <span class="back-text">返回主页</span></a>
        <a href="../index.html">EE工具箱</a>
        <span class="breadcrumb">学术分享 / 论文</span>
        <span class="nav-spacer"></span>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="搜索论文标题、关键词..." oninput="filterPapers(this.value)">
        </div>
    </nav>

    <main class="container">
        <h1>论文分享</h1>
        <p class="blog-desc">精选论文阅读笔记，涵盖模拟/混合信号 IC、电力电子、控制理论等方向。</p>

        <!-- 分类筛选（按钮由 posts.json 动态生成，新 tag 无需改 HTML） -->
        <div class="tag-filter" id="tagFilter"></div>

        <!-- 论文列表（由 posts.json 动态渲染，添加新 .md 后运行 tools/build-blog.bat） -->
        <div id="paperList" class="paper-list"></div>

        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display:none;">
            <p>没有找到匹配的论文。</p>
        </div>

        <!-- 添加提示 -->
        <div class="add-hint info-box" style="margin-top:var(--space-xl);">
            <strong>如何添加新论文：</strong>在 <code>blog/posts/</code> 目录下新建 <code>.md</code> 文件
            （文件头写 <code>title / date / tags</code> 等 front matter，写法可参考已有文章），
            然后双击 <code>tools/build-blog.bat</code> 重建清单并刷新本页即可。
            正文支持 Markdown 语法与 LaTeX 公式（<code>$...$</code> 行内 / <code>$$...$$</code> 独立成行）。
        </div>
    </main>

    <script src="../js/cursor.js"></script>
    <script>
        //RainbowCursor.init();   // 即彩虹循环+粒子喷射+粒子爆发
        OutlineArrowCursor.init();   // 默认即描边箭头+彩虹循环+粒子喷射+粒子爆发
    </script>

    <footer class="site-footer">
        <p>EE工具箱 &copy; 2026</p>
        <div id="busuanzi_container_site_pv" style="display:none"><p class="site-stats">本站访客 <span id="busuanzi_value_site_uv">-</span> &middot; 总浏览 <span id="busuanzi_value_site_pv">-</span> &middot; 本页浏览 <span id="busuanzi_value_page_pv">-</span></p></div>
    </footer>
    <script async src="https://cn.vercount.one/js"></script>

    <script src="../js/common.js"></script>
    <script>
        /* 论文卡片与标签筛选均由 posts.json 动态渲染（新 .md 放入 posts/ 后运行 tools/build-blog.bat） */
        var TAG_NAMES = { analog: '模拟电路', power: '电力电子', control: '控制理论', noise: '噪声与匹配' };
        var papers = [];
        var activeTag = 'all';
        var searchQuery = '';

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function tagName(t) { return TAG_NAMES[t] || t; }

        function filterByTag(tag) {
            activeTag = tag;
            renderTags();
            renderPapers();
        }

        function filterPapers(q) {
            searchQuery = q.toLowerCase();
            renderPapers();
        }

        function renderTags() {
            var seen = [];
            papers.forEach(function (p) {
                (p.tags || []).forEach(function (t) {
                    if (seen.indexOf(t) < 0) seen.push(t);
                });
            });
            var wrap = document.getElementById('tagFilter');
            wrap.innerHTML = '';
            ['all'].concat(seen).forEach(function (t) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tag-btn' + (t === activeTag ? ' active' : '');
                btn.dataset.tag = t;
                btn.textContent = t === 'all' ? '全部' : tagName(t);
                btn.addEventListener('click', function () { filterByTag(t); });
                wrap.appendChild(btn);
            });
        }

        function renderPapers() {
            var html = '';
            var visible = 0;
            papers.forEach(function (p) {
                var tags = p.tags || [];
                var tagMatch = activeTag === 'all' || tags.indexOf(activeTag) >= 0;
                var hay = (p.title + ' ' + (p.authors || '') + ' ' + (p.source || '') + ' '
                    + (p.abstract || '') + ' ' + tags.join(' ')).toLowerCase();
                if (!tagMatch || (searchQuery !== '' && hay.indexOf(searchQuery) < 0)) return;
                visible++;
                var badges = tags.map(function (t) {
                    return '<span class="tag-badge ' + esc(t) + '">' + esc(tagName(t)) + '</span>';
                }).join('');
                var authorLine = p.authors
                    ? '<p class="paper-authors">' + esc(p.authors)
                        + (p.source ? ' — <em>' + esc(p.source) + '</em>' : '') + '</p>'
                    : '';
                var url = 'post.html?p=' + encodeURIComponent(p.file);
                html += '<article class="paper-card-item" data-tags="' + esc(tags.join(' ')) + '">'
                    + '<div class="paper-meta"><span class="paper-year">' + esc(String(p.date).slice(0, 4)) + '</span>' + badges + '</div>'
                    + '<h2 class="paper-title"><a href="' + url + '">' + esc(p.title) + '</a></h2>'
                    + authorLine
                    + '<p class="paper-abstract">' + esc(p.abstract || '') + '</p>'
                    + '<div class="paper-actions"><a href="' + url + '" class="btn btn-sm">阅读笔记</a>'
                    + '<span class="paper-readtime">约 ' + esc(p.readtime) + ' 分钟</span></div>'
                    + '</article>';
            });
            document.getElementById('paperList').innerHTML = html;
            document.getElementById('emptyState').style.display = visible === 0 ? '' : 'none';
        }

        fetch('posts.json')
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (data) {
                papers = data || [];
                renderTags();
                renderPapers();
            })
            .catch(function () {
                var empty = document.getElementById('emptyState');
                empty.innerHTML = '清单加载失败：请先双击 <code>tools/build-blog.bat</code> 生成 <code>blog/posts.json</code>。';
                empty.style.display = '';
            });
    </script>
</body>
</html>
